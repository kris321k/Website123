<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Mamlatdar Court – Goa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #eef3f8;
        }

        header {
            background: #fff;
            text-align: center;
            padding: 20px 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header img {
            height: 85px;
        }

        .title h1 {
            color: #004aad;
            margin-bottom: 5px;
        }

        .title p {
            color: #555;
            margin-top: 0;
        }

        nav a {
            margin: 0 12px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav a:hover {
            color: #005ecb;
        }

        .hero {
            background: #004aad;
            color: #fff;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            font-size: 32px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            background: #fff;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .container h2 {
            text-align: center;
            color: #004aad;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #b7c6d7;
            border-radius: 4px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #004aad;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00337a;
        }

        .back-link {
            margin-top: 15px;
            text-align: center;
        }

        .back-link a {
            color: #004aad;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <img src="goaEmblem.png" alt="Goa Emblem">
        <div class="title">
            <h1>Mamlatdar Court – Goa</h1>
            <p>Department of Revenue | Government of Goa</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Instructions</a>
            <a href="#">File Case</a>
            <a href="#">Track Case</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Forgot Password</h2>
        <p>Reset your account password using registered email or mobile number</p>
    </section>

    <div class="container">
        <h2>Reset Password</h2>

        <label for="email">Registered Email</label>
        <input type="email" id="email" placeholder="Enter your registered email">

        <label for="mobile">Registered Mobile Number</label>
        <input type="text" id="mobile" placeholder="Enter your mobile number">

        <button>Send OTP</button>

        <div class="back-link">
            <a href="index.html">← Back to Login</a>
        </div>
    </div>

</body>
</html>
